services:
  db:
    image: pgvector/pgvector:pg16
    container_name: agents-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agents}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agents}
      POSTGRES_DB: ${POSTGRES_DB:-agents}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agents}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: agents-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: agents-adminer
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: agents-api
    container_name: agents-api
    ports:
      - "${AGENTS_PORT:-3848}:3848"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-agents}:${POSTGRES_PASSWORD:-agents}@db:5432/${POSTGRES_DB:-agents}
      # Default admin on first boot. Override AGENTS_DEFAULT_ADMIN_PASSWORD
      # in .env for anything non-throwaway.
      AGENTS_DEFAULT_ADMIN_EMAIL: ${AGENTS_DEFAULT_ADMIN_EMAIL:-admin@local}
      AGENTS_DEFAULT_ADMIN_PASSWORD: ${AGENTS_DEFAULT_ADMIN_PASSWORD:-admin}
      AGENTS_DEFAULT_ADMIN_NAME: ${AGENTS_DEFAULT_ADMIN_NAME:-Admin}
      # Headless secrets. AGENTS_SECRETS_KEY must persist across restarts —
      # set it in .env or accept the auto-generated one written to
      # /data/secrets/.master.key (which the /data volume preserves).
      AGENTS_SECRETS_BACKEND: file
      AGENTS_SECRETS_KEY: ${AGENTS_SECRETS_KEY:-}
      # Claude Agent SDK auth — required for any agent run.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # GitHub auth used by gh-CLI executors (pr_create, pr_comment, etc.).
      # Either GH_TOKEN here or run `gh auth login` once inside the
      # container (volume-mounted via gh's config dir under /data).
      GH_TOKEN: ${GH_TOKEN:-}
      NODE_ENV: production
    volumes:
      # Persists secrets store, task workspaces, agent run logs, github
      # poller state across container restarts.
      - ./data/agents:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
